# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: /Users/mac/dev/kemovie-uploads
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 邮件通知（订阅上线提醒的邮件渠道）。留空 host 时不启用邮件发送，仅站内信。
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
        # 无 host 时禁用自动配置健康探测
    test-connection: false
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 8
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 影弯 Kemovie 业务配置
kemovie:
  tmdb:
    # TMDB API Key（v3）
    api-key: de0e8fd3da75a5e2b889b66c2930f696
    base-url: https://api.themoviedb.org/3
    image-base: https://image.tmdb.org/t/p
    # 抓取语言与地区
    language: zh-CN
    region: CN
  mdl:
    base-url: https://mydramalist.com
    # 使用本地已安装的 Chrome 无头模式绕过 Cloudflare 挑战
    chrome-path: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    # 单次抓取虚拟时间预算(ms)，等待 CF 挑战通过
    virtual-time-budget: 20000
    # 单页渲染超时(ms)，超时强制结束 Chrome 并读取已渲染内容
    render-timeout: 60000
  # 出网代理（内地环境访问 TMDB/MDL），留空则直连
  proxy:
    enabled: true
    host: 127.0.0.1
    port: 10792
  # 图片本地化：开启后同步影片/人物时自动下载 TMDB 海报、头像到本地存储
  # （通过若依 /profile 静态映射对外服务；后期可替换 ImageStorage 为 OSS 实现）。
  # 实际落盘目录为 ruoyi.profile 下的 kemovie 子目录，local-dir 仅作说明用途。
  image:
    # 是否抓取并落地图片（海报/剧照/人物头像/平台 logo）
    localize: true
    local-dir: /Users/mac/dev/kemovie-uploads/kemovie
    # 图片存储方式：local=本地磁盘（经 /profile 映射对外）；oss=阿里云 OSS
    storage: local
    # storage=oss 时必填（建议用环境变量注入密钥，勿提交真实凭证）
    oss:
      endpoint: oss-cn-hongkong.aliyuncs.com
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      bucket-name: ${OSS_BUCKET_NAME:}
      # 对象 Key 前缀
      dir: kemovie
      # 绑定 CDN/自定义域名时填写，如 https://cdn.example.com；留空用默认 OSS 域名
      domain: ${OSS_DOMAIN:}
      # 是否对上传对象设置公共读（配合 CDN 回源可设 false）
      public-read: true
  # 飞书自建应用（影片资源文档自动生成；个人可免费创建飞书企业后建自建应用）
  # 应用需开通权限：docx:document、drive:drive、drive:file（文档创建/编辑/分享）
  feishu:
    app-id: ${FEISHU_APP_ID:}
    app-secret: ${FEISHU_APP_SECRET:}
    # 国内 https://open.feishu.cn；海外 Lark 用 https://open.larksuite.com
    base-url: https://open.feishu.cn
    # 链接分享范围：anyone_readable 任何人可读 / tenant_readable 仅组织内
    link-share: anyone_readable
  # 微信公众号模板消息（接口测试号即可，个人可免费申请；见 doc/deploy/wechat-sandbox-setup.md）
  wechat:
    app-id: ${WECHAT_MP_APP_ID:}
    app-secret: ${WECHAT_MP_APP_SECRET:}
    # 模板ID：测试号后台新增模板（两个 keyword 槽位），消息点击跳转飞书文档
    template-id: ${WECHAT_MP_TEMPLATE_ID:}
    enabled: true
