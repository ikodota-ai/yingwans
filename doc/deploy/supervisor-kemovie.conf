; 影弯 Kemovie 后端 Supervisor 配置
; 部署：sudo cp doc/deploy/supervisor-kemovie.conf /etc/supervisor/conf.d/kemovie.conf
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status kemovie

[program:kemovie]
command=/usr/bin/java -jar /opt/kemovie/ruoyi-admin.jar --spring.profiles.active=druid,prod
directory=/opt/kemovie
user=www-data
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=60
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/supervisor/kemovie.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
; 基础环境 + 服务器 MySQL/Redis 覆盖（优先级高于 jar 内 yml）。
; 把下面的主机/端口/账号/密码改成服务器实际值；Redis 无密码就把密码留空字符串。
; 注意：本文件含密码，请 chmod 600 /etc/supervisor/conf.d/kemovie.conf
;
; ===== TMDB/MDL 出网代理（重要）=====
; jar 内默认 kemovie.proxy.enabled=true 且指向 127.0.0.1:10792（开发机代理），服务器上没有该端口会导致
; “从 TMDB 同步”失败。先在服务器执行（200 表示可直连）：
;   curl -m 10 -o /dev/null -w "%{http_code}\n" "https://api.themoviedb.org/3/movie/27205?api_key=KEY&language=zh-CN"
;   - 返回 200：保持下面 KEMOVIE_PROXY_ENABLED="false"（直连，境外/香港服务器）。
;   - 返回 000/超时：删掉 KEMOVIE_PROXY_ENABLED="false"，改在 environment 末尾追加三行（注意上一行加逗号）：
;       KEMOVIE_PROXY_ENABLED="true",
;       KEMOVIE_PROXY_HOST="服务器可达的代理IP或127.0.0.1",
;       KEMOVIE_PROXY_PORT="7890"
;   改完：sudo supervisorctl update && sudo supervisorctl restart kemovie
; 另：MDL 抓取依赖 Linux 版 Chrome，需要时再设 KEMOVIE_MDL_CHROME_PATH="/usr/bin/google-chrome"。
environment=
    JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64",
    TZ="Asia/Shanghai",
    SPRING_DATASOURCE_DRUID_MASTER_URL="jdbc:mysql://127.0.0.1:3307/yingwan?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%%2B8",
    SPRING_DATASOURCE_DRUID_MASTER_USERNAME="root",
    SPRING_DATASOURCE_DRUID_MASTER_PASSWORD="改成你的MySQL密码",
    SPRING_DATA_REDIS_HOST="127.0.0.1",
    SPRING_DATA_REDIS_PORT="6379",
    SPRING_DATA_REDIS_PASSWORD="改成你的Redis密码",
    SPRING_DATA_REDIS_DATABASE="8",
    KEMOVIE_PROXY_ENABLED="false"
; 飞书资源文档（可选）：拿到自建应用凭证后，在上一行末尾加逗号并追加下面两行，
; 然后 supervisorctl update && supervisorctl restart kemovie。
; 开通步骤见 doc/deploy/feishu-setup.md（个人可免费创建团队后建自建应用）。
;     FEISHU_APP_ID="cli_xxxxxxxxxxxx",
;     FEISHU_APP_SECRET="xxxxxxxxxxxxxxxx"
