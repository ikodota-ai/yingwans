# 影弯 Kemovie 生产 Nginx 配置（HTTPS 版）
# 放置位置（与服务器现有站点一致）：/usr/local/nginx/conf/vhost/kemovie.conf
# 并确保 nginx.conf 里有：include /usr/local/nginx/conf/vhost/*.conf;
# 重载：/usr/local/nginx/sbin/nginx -t && /usr/local/nginx/sbin/nginx -s reload
#
# 说明：把下面所有 YOUR_MAIN_DOMAIN 替换成你的前台主域名（示例 yingwans.com），
#       并准备好对应证书：
#       /usr/local/nginx/conf/vhost/cert/<域名>.pem
#       /usr/local/nginx/conf/vhost/cert/<域名>.key
# 图片域名 image.yingwans.com 已由 Cloudflare 回源阿里云 OSS，不在本机 Nginx 配置。

# 后端上游（Supervisor 管理的 jar，监听 8080）
upstream kemovie_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# 80 端口：只做 HTTPS 跳转；放行 ACME 证书校验目录
server {
    listen 80;
    server_name yingwans.com www.yingwans.com;

    # 证书签发/续期校验（acme.sh webroot 等）
    location ^~ /.well-known/ {
        root /home/www/yingwans.com;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 主站
server {
    listen 443 ssl;
    http2 on;

    server_name yingwans.com www.yingwans.com;
    root /home/www/yingwans.com/dist;
    index index.html;

    # SSL 证书（改成你的实际域名证书）
    ssl_certificate     /usr/local/nginx/conf/vhost/cert/yingwans.com.pem;
    ssl_certificate_key /usr/local/nginx/conf/vhost/cert/yingwans.com.key;

    # SSL 安全配置（与现有站点保持一致）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 上传图片/二维码大小
    client_max_body_size 20m;

    access_log /home/wwwlogs/yingwans_access.log;

    # gzip
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # 证书校验
    location ^~ /.well-known/ {
        root /home/www/yingwans.com;
        allow all;
    }

    # 带 hash 的构建资源长缓存
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|webp|svg|swf)$ {
        expires 30d;
        access_log off;
    }
    location ~ .*\.(js|css)?$ {
        expires 12h;
        access_log off;
    }
    location = /favicon.ico { access_log off; log_not_found off; }

    # 后端接口：前端生产前缀 /prod-api -> http://127.0.0.1:8080/
    location /prod-api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://kemovie_backend/;
    }

    # 图片走 OSS（image.yingwans.com）。仅当 storage 改回 local 时才放开：
    # location /profile/ {
    #     alias /opt/kemovie/uploads/;
    #     expires 30d;
    # }

    location ~ /\. {
        deny all;
    }

    # 前台(/)与后台(/admin、/system ...) 单页路由统一回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
